<div class="para logical">
<div class="para">Suppose that <span class="process-math">\(M, N\)</span> and <span class="process-math">\(P\)</span> are both Artinian and Noetherian <span class="process-math">\(A\)</span>-modules. If <span class="process-math">\(0\to N\to M\to P\to 0\)</span> is a short exact sequence of modules then,</div>
<div class="displaymath process-math">
\begin{equation*}
\ell(N)+\ell(P)=\ell(M).
\end{equation*}
