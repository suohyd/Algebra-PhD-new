<div class="para logical">
<div class="para">If <span class="process-math">\(M\)</span> is a right <span class="process-math">\(A\)</span>-module then,</div>
<div class="displaymath process-math">
\begin{equation*}
\End{A}{\oplus_n\,M}\simeq M_n\left(\End{A}{M}\right).
\end{equation*}
</div>
<div class="para">As a particular case</div>
<div class="displaymath process-math">
\begin{equation*}
\End{A}{\oplus_n\,A_A}\simeq M_n(A).
\end{equation*}
</div>
